# Production on a single VM (e.g. Oracle Cloud Always Free / trial): the app container plus Caddy for HTTPS.
#   echo "DOMAIN=your-name.duckdns.org" > .env
#   docker compose -f docker-compose.prod.yml up -d --build
# The first start builds the index from data/catalog.jsonl.gz and embeds every use case (can take an hour);
# it is kept on the typesense-data volume, so later restarts take seconds.
services:
  search:
    build: .
    restart: unless-stopped
    volumes:
      - typesense-data:/data
    environment:
      PORT: "7860"
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - search
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN in .env} --to search:7860

volumes:
  typesense-data:
  caddy-data:
