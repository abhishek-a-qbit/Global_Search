# Production on a single VM (e.g. Oracle Cloud Always Free / trial): the app container plus Caddy for HTTPS.
#   echo "DOMAIN=your-name.duckdns.org" > .env
#   docker compose -f docker-compose.prod.yml up -d --build
# The index is rebuilt from data/catalog.jsonl.gz at every start (about 30 s).
services:
  search:
    build: .
    restart: unless-stopped
    environment:
      PORT: "7860"
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - search
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN in .env} --to search:7860

volumes:
  caddy-data:
