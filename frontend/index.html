<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuspera search demo</title>
<style>
  :root { --bg:#f7f7f8; --card:#fff; --text:#1c1c1e; --muted:#6b6b72; --line:#e4e4e8; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141417; --card:#1d1d21; --text:#ececef; --muted:#9a9aa3; --line:#2c2c32; --accent:#818cf8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width:1280px; margin:32px auto; padding:0 16px; }
  h1 { font-size:20px; margin:0 0 16px; }
  input { width:100%; padding:14px 16px; font-size:17px; border:1px solid var(--line);
          border-radius:12px; background:var(--card); color:var(--text); outline:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .chips { margin:10px 0 4px; display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:999px;
          padding:3px 10px; font-size:13px; cursor:pointer; }
  .chip:hover { color:var(--text); border-color:var(--accent); }
  .meta { color:var(--muted); font-size:13px; margin:10px 2px; min-height:18px; }
  .meta b { color:var(--text); font-weight:600; }
  .board { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:12px; height:62vh; margin-top:8px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px;
         display:flex; flex-direction:column; overflow:hidden; min-width:0; }
  .box h2 { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
            margin:0; padding:10px 14px; border-bottom:1px solid var(--line); flex:none; }
  .box h2 .count { font-weight:400; letter-spacing:0; margin-left:6px; }
  .items { overflow-y:auto; flex:1; }
  .item { display:block; padding:9px 14px; text-decoration:none; color:inherit;
          border-bottom:1px solid var(--line); cursor:pointer; }
  .item:last-child { border-bottom:0; }
  .item:hover { background:color-mix(in srgb, var(--accent) 8%, transparent); }
  .item.active { background:color-mix(in srgb, var(--accent) 14%, transparent); }
  .title { font-weight:600; }
  .tag { display:inline-block; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
         color:var(--accent); margin-right:6px; }
  .path { color:var(--muted); font-size:12px; word-break:break-all; }
  .none { color:var(--muted); padding:18px 14px; font-size:13px; }
  .empty { color:var(--muted); padding:24px 4px; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>Cuspera global search <span style="color:var(--muted);font-weight:400">(demo)</span></h1>
  <input id="q" type="search" placeholder="Try: 6sense, algolia news, canva vs fi, crm" autofocus autocomplete="off">
  <div class="chips" id="chips">
  </div>
  <div class="meta" id="meta"></div>
  <div class="board" id="board"></div>
</main>

<script>
// FastAPI backend: a separate server when served by `http.server 5500`, else same origin (FastAPI serves this page)
const API_BASE = location.port === "5500" ? "http://127.0.0.1:8000" : "";
const EXAMPLES = ["6s", "6sense", "6sense news", "news 6sense", "algoli", "algolia", "algolia ne",
                  "algolia customer story", "canva vs fi", "canva figma", "figma and canva", "canva alternatives", "crm", "banking", "adob",
                  "hubspot use cases", "use cases cr", "lead management automation"];
const $q = document.getElementById("q");
const $meta = document.getElementById("meta");
const $board = document.getElementById("board");

// columns: products | use cases | pages (news, stories, alternatives, categories, industries) | comparisons
const GROUPS = [
  { title: "Products", keys: ["products"] },
  { title: "Use cases", keys: ["use_cases", "use_case"] },
  { title: "Pages", keys: ["news", "customer_story", "alternatives", "category", "industry"] },
  { title: "Comparisons", keys: ["compare"] },
];
const TAG = { news: "News", customer_story: "Story", alternatives: "Alternatives",
              category: "Category", industry: "Industry" };

document.getElementById("chips").append(...EXAMPLES.map(t => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = t;
  b.onclick = () => { $q.value = t; search(t); $q.focus(); };
  return b;
}));

let timer, controller;
let lastSearch = null;          // latest /api/search response
let detail = null;              // hovered product's /api/product/{pid} response
let activePid = null;
const detailCache = {};
const loading = new Set();      // section keys whose next page is being fetched

$q.addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(() => search($q.value), 150);          // debounce
});

async function search(q) {
  if (controller) controller.abort();                        // cancel stale request
  if (q.trim().length < 2) { $meta.textContent = ""; $board.replaceChildren(); lastSearch = null; return; }
  controller = new AbortController();
  try {
    const res = await fetch(API_BASE + "/api/search?q=" + encodeURIComponent(q), { signal: controller.signal });
    if (res.status === 503) timer = setTimeout(() => search($q.value), 5000);   // cold start: retry while loading
    if (!res.ok) throw new Error(await res.json().then(b => b.detail, () => null) || `${res.status} ${res.statusText}`);
    lastSearch = await res.json();
    detail = null; activePid = null;
    renderMeta(lastSearch);
    renderBoard();
  } catch (e) {
    if (e.name === "AbortError") return;
    $meta.textContent = ""; $board.replaceChildren(el("div", "empty", "Error: " + e.message));
  }
}

async function showProduct(pid) {
  if (activePid === pid) return;
  activePid = pid;
  highlightActive();
  if (!(pid in detailCache)) {
    try {
      const res = await fetch(API_BASE + "/api/product/" + pid);
      detailCache[pid] = res.ok ? await res.json() : null;
    } catch { detailCache[pid] = null; }
  }
  if (activePid !== pid) return;                 // moved on while fetching
  detail = detailCache[pid];
  renderBoard();
}

function highlightActive() {
  $board.querySelectorAll(".item.active").forEach(n => n.classList.remove("active"));
  if (activePid != null)
    $board.querySelector(`.item[data-pid="${activePid}"]`)?.classList.add("active");
}

$board.addEventListener("mouseover", e => {
  const a = e.target.closest(".item[data-pid]");
  if (a) showProduct(+a.dataset.pid);
});

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function sectionItems(sections, key) {
  const sec = sections.find(s => s.key === key);
  return sec ? sec.items : [];
}

function columnsFor(sections) {
  return GROUPS.map(g => {
    const items = [];
    let total = 0, paged = null;
    for (const k of g.keys) {
      const sec = sections.find(s => s.key === k);
      if (!sec) continue;
      for (const it of sec.items) items.push({ ...it, tag: TAG[k] });
      total += Math.max(sec.total ?? 0, sec.items.length);
      if (sec.next) paged = k;                    // more pages of this section load on scroll
    }
    return { title: g.title, items, total, paged };
  });
}

// ---- more on scroll: the rest of an ambiguous search's use cases / comparisons ----
async function loadMore(key) {
  const data = lastSearch, sec = data?.sections.find(s => s.key === key);
  if (detail || !sec?.next || loading.has(key)) return;
  loading.add(key);
  try {
    const n = sec.next;
    let items = [], next = null;
    if (n.kind === "use_case") {
      const r = await getJSON(`/api/more?kind=use_case&q=${encodeURIComponent(n.q)}&page=${n.page}`);
      items = r.items; next = r.next;
    } else {                                      // comparisons: of the next few products, in list order
      const pids = sectionItems(data.sections, "products").map(it => it.pid).filter(Boolean);
      let offset = n.offset;
      const seen = new Set(sec.items.map(it => it.url));
      while (offset < pids.length && !items.length) {
        const r = await getJSON(`/api/more?kind=compare&pids=${pids.slice(offset, offset + 5).join(",")}`);
        items = r.items.filter(it => !seen.has(it.url));   // a pair of two listed products: shown once
        offset += 5;
      }
      next = offset < pids.length ? { kind: "compare", offset } : null;
    }
    if (lastSearch !== data) return;              // a new search started meanwhile
    const have = new Set(sec.items.map(it => key === "use_case" ? it.title.toLowerCase() : it.url));
    sec.items.push(...items.filter(it => !have.has(key === "use_case" ? it.title.toLowerCase() : it.url)));
    sec.next = next;
  } catch (e) {
    console.warn("load more failed", e);
    return;
  } finally {
    loading.delete(key);
  }
  renderBoard();
}

async function getJSON(path) {
  const res = await fetch(API_BASE + path);
  if (!res.ok) throw new Error(await res.json().then(b => b.detail, () => null) || `${res.status} ${res.statusText}`);
  return res.json();
}

function nearBottom(list) { return list.scrollTop + list.clientHeight >= list.scrollHeight - 300; }

$board.addEventListener("scroll", e => {         // scroll does not bubble: listen in the capture phase
  const list = e.target.closest?.(".items[data-paged]");
  if (list && nearBottom(list)) loadMore(list.dataset.paged);
}, true);

function renderMeta(data) {
  const parts = [];
  parts.push(data.anchor ? `anchor: <b>${esc(data.anchor)}</b> (${data.rule})` : `no confident product (${data.rule})`);
  if (data.anchor2) parts.push(`vs <b>${esc(data.anchor2)}</b>`);
  if (data.intent) parts.push(`intent: <b>${data.intent}</b>`);
  if (data.category_exact) parts.push(`category: <b>${esc(data.category_exact)}</b> (exact)`);
  if (data.use_cases_semantic) parts.push(`use cases: <b>keyword + semantic</b>`);
  parts.push(`${data.took_ms} ms`);
  $meta.innerHTML = parts.join(" · ");
}

function renderBoard() {
  if (!lastSearch) return;
  const scrolls = {};
  $board.querySelectorAll(".box").forEach(b => scrolls[b.dataset.col] = b.querySelector(".items").scrollTop);
  const products = sectionItems(lastSearch.sections, "products");   // kept while hovering
  const cols = columnsFor(detail ? detail.sections : lastSearch.sections)
    .map((c, i) => i === 0 ? { ...c, items: products, total: products.length, paged: null } : c)
    .filter(c => c.items.length);                                   // no empty boxes
  if (!cols.length) {
    $board.replaceChildren(el("div", "empty", "No results"));
    return;
  }
  $board.replaceChildren(...cols.map(col => {
    const box = el("div", "box");
    box.dataset.col = col.title;
    const h2 = el("h2", "", col.title);
    h2.append(el("span", "count", col.total.toLocaleString()));
    box.append(h2);
    const list = el("div", "items");
    if (col.paged && !detail) list.dataset.paged = col.paged;
    if (!col.items.length) list.append(el("div", "none", "—"));
    col.items.forEach(it => {
      const a = el("a", "item"); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
      if (it.pid) a.dataset.pid = it.pid;
      const title = el("div", "title");
      if (it.tag) title.append(el("span", "tag", it.tag));
      title.append(document.createTextNode(it.title));
      a.append(title, el("div", "path", it.path));
      list.append(a);
    });
    if (list.dataset.paged) list.append(el("div", "none", "Loading more…"));
    box.append(list);
    return box;
  }));
  $board.querySelectorAll(".box").forEach(b => b.querySelector(".items").scrollTop = scrolls[b.dataset.col] || 0);
  $board.querySelectorAll(".items[data-paged]").forEach(list => {   // not filled yet / still at the end: next page
    if (nearBottom(list)) loadMore(list.dataset.paged);
  });
  highlightActive();
}

function esc(s) { return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
</script>
</body>
</html>
